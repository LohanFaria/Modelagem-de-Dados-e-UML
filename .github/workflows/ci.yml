name: CI & onp-spec Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    env:
      DB_ENGINE: sqlite
      DJANGO_SETTINGS_MODULE: config.settings.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run onp-spec Verify
        run: |
          npx -y @onovoprogramador/onp-spec verify xpto-investimentos-fullstack-django

      - name: Run onp-spec Audit CI Gate
        run: |
          npx -y @onovoprogramador/onp-spec audit --ci
