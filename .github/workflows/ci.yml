name: CI & onp-spec Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    env:
      DB_ENGINE: sqlite
      DJANGO_SETTINGS_MODULE: config.settings.dev
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and link binaries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo ln -sf $(which pytest) /usr/local/bin/pytest
          sudo ln -sf $(which python3) /usr/local/bin/python3

      - name: Run onp-spec Verify
        run: |
          node .agents/skills/onp-spec-driven/scripts/onp-spec.mjs verify xpto-investimentos-fullstack-django

      - name: Run onp-spec Audit CI Gate
        run: |
          node .agents/skills/onp-spec-driven/scripts/onp-spec.mjs audit --ci
