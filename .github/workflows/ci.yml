name: CI & onp-spec Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    env:
      DB_ENGINE: sqlite
      DJANGO_SETTINGS_MODULE: config.settings.dev
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Virtualenv and Install Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run onp-spec Verify
        run: |
          source .venv/bin/activate
          node .agents/skills/onp-spec-driven/scripts/onp-spec.mjs verify xpto-investimentos-fullstack-django

      - name: Run onp-spec Audit CI Gate
        run: |
          source .venv/bin/activate
          node .agents/skills/onp-spec-driven/scripts/onp-spec.mjs audit --ci
